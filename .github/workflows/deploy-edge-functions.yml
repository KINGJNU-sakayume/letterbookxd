name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: walvasjnydandxpzivzd
      ALADIN_API_KEY: ${{ secrets.ALADIN_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$ALADIN_API_KEY"

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Apply database migrations
        run: supabase db push

      - name: Configure Aladin Edge Function secret
        run: supabase secrets set ALADIN_API_KEY="$ALADIN_API_KEY" --project-ref "$PROJECT_ID"

      - name: Deploy aladin-proxy
        run: supabase functions deploy aladin-proxy --no-verify-jwt --project-ref "$PROJECT_ID"
