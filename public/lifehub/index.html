<p>Life Hub 연결을 마무리하는 중…</p>
<script>
  // Life Hub returns here. Hand the one-time result to the app in this tab's sessionStorage,
  // drop it from the address, and open the bookshelf, which finishes the sign-in.
  try { sessionStorage.setItem('letterbookxd.lifehub.callback.v1', location.search); } catch (e) { /* the app reports it */ }
  location.replace(new URL('../#/bookshelf', location.href).href);
</script>
